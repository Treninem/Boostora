# One-shot verified release workflow; removes itself after success.
name: Apply Boostora v3.6.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v366.yml'
      - 'apply_v366.py'

permissions:
  contents: write

env:
  BOT_TOKEN: '123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi'
  BOT_DATA_DIR: '/tmp/boostora-ci'
  DB_PATH: 'boostora-ci.db'
  ENABLE_XTR_PAYMENTS: '0'
  BOOSTORE_ENABLED: '0'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Apply and verify v3.6.6
        run: python apply_v366.py
      - name: Commit verified release and remove one-shot updater
        run: |
          rm -f apply_v366.py .github/workflows/apply-v366.yml
          git config user.name "Treninem"
          git config user.email "trenin.98@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "Boostora v3.6.6: modernize UTC handling"
          git push origin HEAD:main
