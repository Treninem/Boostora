<html lang="ru">
<head>

  <title>Boostora</title>

  <style>
    :root {
      --bg: var(--tg-theme-bg-color,#10081b); --surface: var(--tg-theme-secondary-bg-color,#21132f);
      --text: var(--tg-theme-text-color,#fff); --hint: var(--tg-theme-hint-color,rgba(255,255,255,.68));

    }
    *{box-sizing:border-box} html{background:var(--bg)} body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 5% -5%,rgba(123,60,255,.38),transparent 34%),radial-gradient(circle at 100% 0,rgba(243,180,71,.16),transparent 28%),var(--bg);-webkit-tap-highlight-color:transparent}
    button,input,select,textarea{font:inherit} button{cursor:pointer;touch-action:manipulation} [hidden]{display:none!important}
    .top{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);background:rgba(16,8,27,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .topin,.wrap{width:min(100%,980px);margin:0 auto}.topin{min-height:60px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.logo{width:40px;height:40px;border-radius:14px;object-fit:cover;box-shadow:0 9px 25px rgba(0,0,0,.34)}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12px;color:var(--hint);white-space:nowrap}
    .wrap{padding:15px 13px calc(92px + var(--safe-bottom))}.page{animation:appear .16s ease}@keyframes appear{from{opacity:.2;transform:translateY(4px)}}
    .hero{display:grid;grid-template-columns:1.08fr .92fr;align-items:center;gap:14px;padding:20px;border-radius:28px;overflow:hidden;background:linear-gradient(135deg,rgba(49,21,79,.98),rgba(102,40,199,.93) 58%,rgba(190,128,35,.9));box-shadow:0 18px 45px rgba(0,0,0,.32)}.hero h1{margin:0 0 8px;font-size:clamp(28px,7vw,48px);line-height:1}.hero p{margin:0;color:rgba(255,255,255,.78);line-height:1.45}.hero img{width:100%;max-height:235px;object-fit:contain;filter:drop-shadow(0 15px 25px rgba(0,0,0,.32))}.eyebrow{font-size:11px!important;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#ffe2a0!important;margin-bottom:8px!important}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:9px;margin:23px 2px 10px}.section-head h2{margin:0;font-size:21px}.section-head span{color:var(--hint);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-width:0;padding:13px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.045));box-shadow:0 10px 26px rgba(0,0,0,.15)}.card img{width:100%;height:126px;object-fit:cover;border-radius:17px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04)}.card h3{margin:10px 0 5px;font-size:17px}.card p{margin:5px 0}.muted{color:var(--hint);line-height:1.42}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btn{min-height:44px;border:0;border-radius:15px;padding:11px 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:850;color:var(--button-text);background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 8px 20px rgba(0,0,0,.18)}.btn.gold{background:linear-gradient(135deg,#ffd36a,#e69b1c);color:#251604}.btn.secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--line);box-shadow:none}.btn.danger{background:rgba(255,116,116,.15);color:#ffd2d2;border:1px solid rgba(255,116,116,.3);box-shadow:none}.btn.full{width:100%}.btn:disabled{opacity:.55;cursor:wait}.btn.tiny{min-height:35px;padding:7px 10px;border-radius:12px;font-size:12px}
    .stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.stat{padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--card)}.stat b{display:block;font-size:22px;margin-bottom:3px}.stat span{color:var(--hint);font-size:11px}.profile{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:21px;background:var(--card)}.avatar{width:62px;height:62px;border-radius:18px;object-fit:cover;border:1px solid var(--line)}
    .chips{display:flex;gap:7px;overflow:auto;padding:2px 0 6px;scrollbar-width:none}.chip{flex:0 0 auto;min-height:38px;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--card);color:var(--text);font-weight:750}.chip.active{background:linear-gradient(135deg,var(--purple),var(--pink));border-color:transparent}.search{display:flex;gap:8px;margin-bottom:10px}.field,input,select,textarea{width:100%;border:1px solid var(--line);border-radius:15px;padding:12px 13px;color:var(--text);background:rgba(255,255,255,.075);outline:none}.field:focus,input:focus,select:focus,textarea:focus{border-color:rgba(243,180,71,.75);box-shadow:0 0 0 3px rgba(243,180,71,.1)} select{color-scheme:dark;background-color:#30203f!important;color:#fff!important}select option{background:#30203f;color:#fff}textarea{min-height:90px;resize:vertical} label{display:block;margin:10px 0 5px;color:var(--hint);font-size:12px;font-weight:750}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:9px}.row{padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--card)}.row-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.row h3,.row h4{margin:0 0 5px}.badge{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(255,255,255,.1);color:var(--hint)}.badge.green{background:rgba(71,223,160,.12);color:#a6ffd7}.badge.red{background:rgba(255,116,116,.13);color:#ffc0c0}.badge.gold{background:rgba(243,180,71,.13);color:#ffe0a0}.price{font-weight:900;color:#ffe09a}.progress{height:9px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.1);margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--gold));border-radius:inherit}.empty{padding:24px 15px;text-align:center;color:var(--hint);border:1px dashed var(--line);border-radius:20px}.notice{padding:12px 13px;border:1px solid rgba(243,180,71,.26);border-radius:17px;background:rgba(243,180,71,.08);color:#ffe6af;margin-bottom:11px}.notice.error{border-color:rgba(255,116,116,.28);background:rgba(255,116,116,.08);color:#ffd0d0}
    .bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(16,8,27,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.nav{width:min(100%,720px);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{min-width:0;min-height:58px;padding:5px 2px;border:0;border-radius:14px;background:transparent;color:var(--hint);font-size:10px}.nav b{display:block;font-size:19px;margin-bottom:2px}.nav button.active{background:rgba(255,255,255,.11);color:#fff}
    .modal-backdrop{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.65);display:grid;align-items:end;padding-top:var(--safe-top)}.modal{width:min(100%,720px);max-height:92vh;overflow:auto;margin:0 auto;padding:18px 15px calc(18px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0;background:#21132f;border:1px solid var(--line);box-shadow:0 -18px 55px rgba(0,0,0,.45)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.modal-head h2{margin:0}.close{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:20px}.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));z-index:120;transform:translate(-50%,18px);width:min(calc(100% - 28px),520px);padding:12px 14px;border-radius:16px;background:#2b183b;border:1px solid var(--line);box-shadow:0 14px 35px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.2s;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.loader{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:760px){.hero{grid-template-columns:1fr}.hero img{max-height:190px}.grid{grid-template-columns:1fr 1fr}.stat-grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.grid.two,.form-grid{grid-template-columns:1fr}.hero{padding:17px;border-radius:23px}.wrap,.topin{padding-left:11px;padding-right:11px}.nav button{font-size:9px}}
  </style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand"><img class="logo" src="assets/boostora-logo.png" alt=""><span id="brandName">Boostora</span></div><span class="pill" id="rolePill">Подключение…</span></div></header>
<main class="wrap" id="app"><section class="empty"><span class="loader"></span><p>Загружаем кабинет…</p></section></main>
<nav class="bottom" id="bottomNav" hidden><div class="nav">
  <button data-page="home" class="active"><b>🏠</b>Главная</button><button data-page="work"><b>🔥</b><span id="workNavText">Продвижение</span></button><button data-page="wallet"><b>✨</b>Искры</button><button data-page="profile"><b>👤</b>Профиль</button><button data-page="services"><b>🧰</b>Доп.</button>
</div></nav>
<div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal"><div class="modal-head"><h2 id="modalTitle">Окно</h2><button class="close" id="modalClose" aria-label="Закрыть">×</button></div><div id="modalBody"></div></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  'use strict';
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  const app = document.getElementById('app'), nav = document.getElementById('bottomNav');
  const modalBackdrop = document.getElementById('modalBackdrop'), modalTitle = document.getElementById('modalTitle'), modalBody = document.getElementById('modalBody');
  let session = null, currentPage = 'home', toastTimer = null, modalLocked = false;
  const cache = {catalog:null,wallet:null,campaigns:null,tasks:null,profile:null,orders:null,admin:null,owner:null,ownerCatalog:null};
  const catalogState = {category:'',subcategory:'',query:'',page:1};
  const ownerCatalogState = {category:'',subcategory:'',page:1};

  const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  const fmt = (value) => new Intl.NumberFormat('ru-RU').format(Number(value || 0));
  const roleName = role => role === 'client' ? 'Заказчик' : role === 'performer' ? 'Исполнитель' : 'Роль не выбрана';
  const statusName = status => ({draft:'Ожидает подтверждения',expired:'Время подтверждения истекло',invoice_failed:'Расчёт не завершён',paid:'Оплачен',paid_pending:'Оплачен, ожидает запуска',placed:'Запущен',pending:'В работе',processing:'В работе',completed:'Выполнен',partial:'Частично',canceled:'Отменён',failed:'Требует проверки',active:'Активна',paused:'Приостановлена',awaiting_contribution:'Ожидает сетевого размещения',paused_platform_required:'Нужна доступная площадка',published:'Опубликовано',revoked:'Отозвано из-за нарушения',locked:'Ожидает подходящего окна',publishing:'Публикуется',completed_campaign:'Завершена',taken:'Выполняется',manual_review:'На проверке',approved:'Одобрено',rejected:'Отклонено'}[status] || 'Статус обновляется');
  const taskTypeName = code => ({channel_subscribe:'Подписка на канал',chat_join:'Вступление в чат',join_request:'Заявка на вступление',post_reaction:'Реакция',post_like:'Реакция 👍',post_comment:'Комментарий',chat_message:'Сообщение в чате',poll_vote:'Голосование',post_view:'Открытие публикации',link_click:'Открытие ссылки'}[code]||code||'Задание');
  const verificationName = (state,status) => ({pending:'ожидаем действие',verified:'проверено автоматически',holding:'на контрольной проверке',failed:'выполнение не найдено',unavailable:'проверка временно недоступна',manual:'ручная проверка',revoked:'выполнение отменено'}[state]||(status==='approved'?'подтверждено':'проверяем'));
  const resultText = key => ({
    campaign_created_active:'Кампания создана и запущена.',campaign_created_draft:'Черновик сохранён.',campaign_balance_low:'Недостаточно Искр для запуска.',campaign_target_invalid:'Проверь ссылку.',campaign_target_message_link_required:'Нужна ссылка на конкретный пост.',campaign_target_admin_required:'Добавь бота администратором канала.',campaign_price_below_floor:'Цена ниже допустимого минимума.',campaign_paused:'Кампания приостановлена.',campaign_resumed:'Кампания продолжена.',campaign_launched:'Кампания запущена.',
    task_taken:'Задание взято.',task_taken_auto:'Задание взято. Выполни действие — Boostora проверит его сама.',task_limit_reached:'Достигнут лимит активных заданий.',task_repeat_blocked:'Это задание уже выполнялось.',proof_accepted:'Выполнение принято. Искры начислены.',task_verified_hold:'Выполнение подтверждено. Искры на контрольной проверке.',proof_sent_manual_review:'Отправлено на ручную проверку.',proof_empty:'Добавь подтверждение.',task_auto_verified:'Выполнение подтверждено.',task_verification_failed:'Выполнение пока не найдено.',task_target_opened:'Цель открыта. После выполнения вернись в Boostora.',task_verify_unavailable:'Проверка временно недоступна. Попробуй ещё раз позже.',task_join_request_not_found:'Заявка на вступление пока не найдена.',task_message_not_found:'Сообщение пока не найдено.',task_comment_not_found:'Комментарий пока не найден.',task_comment_too_short:'Комментарий слишком короткий.',task_comment_emoji_only:'Нужен осмысленный текст, а не только эмодзи.',task_comment_link_blocked:'В этом задании ссылки в комментарии запрещены.',task_comment_condition_missing:'Комментарий не соответствует условию.',task_comment_duplicate:'Такой комментарий уже использовался.',task_reaction_not_found:'Реакция пока не найдена.',task_reaction_removed:'Реакция снята.',task_reaction_wrong:'Поставлена другая реакция.',task_poll_unavailable:'Этот опрос нельзя проверить автоматически.',task_poll_vote_not_found:'Голос пока не найден.',task_poll_vote_removed:'Голос в опросе отменён.',task_poll_vote_wrong:'Выбран другой вариант.',task_target_not_opened:'Сначала открой цель задания.',retention_confirmed:'Контрольная проверка пройдена.',
    campaign_target_bot_not_in_chat:'Добавь Boostora администратором этого канала или чата и повтори проверку.',campaign_target_bot_missing_rights:'Боту не хватает прав для работы в этом канале или чате.',agreement_required:'Сначала прими правила и условия.',boostore_quantity_out_of_range:'Количество вне допустимого диапазона.',boostore_order_link_invalid:'Нужна корректная ссылка Telegram.',boostore_service_not_enabled:'Услуга временно недоступна.',service_temporarily_unavailable:'Оформление заказов временно приостановлено.',boostore_order_payment_required:'Сначала требуется подтверждённая оплата.',boostore_order_placed:'Заказ запущен.',boostore_order_paid:'Искры списаны. Заказ принят.',boostore_price_changed:'Цена изменилась. Проверь новый расчёт и подтверди ещё раз.',insufficient_internal_balance:'Недостаточно Искр.',network_platform_required:'Добавь Boostora администратором хотя бы в один подходящий канал или чат.',network_no_matching_platforms:'Сейчас нет подходящих площадок.',network_budget_too_low:'Бюджет ниже минимального.',network_quote_ready:'Прогноз рассчитан.',network_campaign_created:'Кампания создана.',network_platform_saved:'Расписание сохранено.',network_quote_changed:'Прогноз изменился. Проверь обновлённый расчёт и подтверди снова.',network_target_invalid:'Укажи корректную ссылку Telegram.',network_target_platform_required:'Выбери подключённый канал или чат. Бот должен быть администратором и иметь право создавать пригласительные ссылки.',network_ad_text_too_short:'Добавь понятное описание не короче 10 символов.',runtime_setting_saved:'Настройка сохранена.',runtime_setting_invalid:'Укажи целое число.',runtime_setting_out_of_range:'Значение выходит за допустимые пределы.',star_refund_completed:'Возврат выполнен. Искры и выбранные бонусы списаны.',star_payment_not_found:'Платёж не найден.',refund_reason_required:'Укажи причину возврата.',refund_credits_already_used:'На балансе уже недостаточно купленных Искр для полного возврата.',star_refund_failed:'Telegram не подтвердил возврат. Баланс пользователя восстановлен.',star_payment_already_refunded:'Этот платёж уже возвращён.',boostore_markup_saved:'Наценка услуги сохранена.',boostore_markup_invalid:'Укажи корректный процент наценки.',boostore_sync_success:'Каталог обновлён.',boostore_service_enabled:'Услуга добавлена в витрину.',boostore_service_disabled:'Услуга убрана из витрины.',
    owner_balance_adjusted:'Баланс изменён и записан в журнал.',owner_balance_too_low:'На балансе недостаточно средств для списания.',owner_user_not_found:'Пользователь не найден.',admin_submission_approved:'Заявка одобрена.',admin_submission_rejected:'Заявка отклонена.'
  }[key] || (String(key||'').includes('_')?'Не удалось выполнить действие. Проверь данные и попробуй ещё раз.':(key||'Готово')));

  function toast(text, error=false){ const n=document.getElementById('toast'); n.textContent=text; n.style.borderColor=error?'rgba(255,116,116,.5)':''; n.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>n.classList.remove('show'),3000); }
  function openModal(title, html, locked=false){ modalLocked=!!locked; modalTitle.textContent=title; modalBody.innerHTML=html; modalBackdrop.hidden=false; document.getElementById('modalClose').hidden=modalLocked; try{if(!modalLocked)tg&&tg.BackButton.show();else tg&&tg.BackButton.hide();}catch(_){} }
  function closeModal(force=false){ if(modalLocked&&!force)return; modalLocked=false; modalBackdrop.hidden=true; modalBody.innerHTML=''; document.getElementById('modalClose').hidden=false; try{tg&&tg.BackButton.hide();}catch(_){} }
  document.getElementById('modalClose').onclick=()=>closeModal(); modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)closeModal();});
  if(tg){ tg.ready(); tg.expand(); try{tg.enableClosingConfirmation();tg.BackButton.onClick(closeModal);}catch(_){} }

  async function api(operation,payload={}){
    if(!tg||!tg.initData) throw new Error('Открой Mini App из Telegram.');
    const response=await fetch('/api/miniapp/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData,operation,payload})});
    let data={}; try{data=await response.json();}catch(_){throw new Error('Сервер вернул неверный ответ.');}
    if(!response.ok||data.ok===false){
      const err=data.error||data.result||'request_failed';
      if(err==='rules_required'||err==='legal_required'||err==='agreement_required'){await showDocumentsGate();}
      if(err==='subscription_required') showSubscriptionGate(data.required_chats||[]);
      if(err==='role_required'||err==='client_role_required') {toast('Сначала выбери подходящую роль в профиле.',true);setPage('profile');}
      throw Object.assign(new Error(resultText(err)),{code:err,data});
    }
    return data;
  }
  async function loadSession(){
    if(!tg||!tg.initData){ app.innerHTML='<section class="notice error">Открой Boostora кнопкой Mini App внутри Telegram.</section>'; return; }
    const response=await fetch('/api/telegram/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData})});
    const data=await response.json(); if(!response.ok||!data.authenticated) throw new Error('Сессия Telegram не подтверждена.');
    session=data; document.getElementById('brandName').textContent='Boostora'; updateRolePill();
    const docs=data.bootstrap&&data.bootstrap.documents||{};
    if(!docs.agreement){nav.hidden=true; await showDocumentsGate(); return;}
    nav.hidden=false; renderCurrent();
    if(!session.access.role) setTimeout(()=>showRoleGate(),100);

ns"><button class="btn secondary" id="netQuote">Рассчитать</button><button class="btn gold" id="netCreate" hidden>Создать кампанию</button></div><div id="netResult"></div>`;modalBody.querySelectorAll('[data-connect-platform]').forEach(b=>b.onclick=()=>openExternal(b.dataset.connectPlatform));let quote=null;modalBody.querySelectorAll('[data-platform-edit]').forEach(b=>b.onclick=()=>editNetworkPlatform(Number(b.dataset.platformEdit),(d.platforms||[]).find(p=>Number(p.chat_id)===Number(b.dataset.platformEdit))));document.getElementById('netQuote').onclick=async()=>{try{quote=await api('network.quote',{target_chat_id:Number(document.getElementById('netTargetPlatform').value),ad_text:document.getElementById('netText').value,budget_credits:Number(document.getElementById('netBudget').value),topic_code:document.getElementById('netTopic').value,language_code:'ru'});document.getElementById('netResult').innerHTML=`<div class="notice" style="margin-top:12px">Площадок: <b>${fmt(quote.platform_count)}</b><br>Расчётная аудитория: <b>${fmt(quote.reach_min)}–${fmt(quote.reach_max)}</b><br>Ожидаемые переходы: <b>${fmt(quote.clicks_min)}–${fmt(quote.clicks_max)}</b><br>Ожидаемые подписки: <b>${fmt(quote.subscribers_min)}–${fmt(quote.subscribers_max)}</b><br>Ориентировочный срок: <b>${fmt(quote.estimated_days_min)}–${fmt(quote.estimated_days_max)} дн.</b><br>К списанию: <b>${fmt(quote.estimated_spend)} Искр</b>${quote.unused_budget?`<br>Останется на балансе: <b>${fmt(quote.unused_budget)} Искр</b>`:''}<br><span class="muted small">Это прогноз, а не гарантия результата.</span></div>`;document.getElementById('netCreate').hidden=false;}catch(e){toast(e.message,true);}};document.getElementById('netCreate').onclick=async()=>{try{const r=await api('network.create',{target_chat_id:Number(document.getElementById('netTargetPlatform').value),ad_text:document.getElementById('netText').value,budget_credits:Number(document.getElementById('netBudget').value),topic_code:document.getElementById('netTopic').value,language_code:'ru',expected_spend:quote&&quote.estimated_spend});toast(resultText(r.result));closeModal(true);await refreshSession();}catch(e){toast(e.message,true);}};}catch(e){modalBody.innerHTML=`<div class="notice error">${esc(e.message)}</div>`;}}
  function editNetworkPlatform(chatId,p){const tz=-new Date().getTimezoneOffset();openModal('Настройка площадки',`<h3>${esc(p&&p.title||'Площадка')}</h3><div class="notice">Минимум — одно доступное размещение в сутки. Конкретную далёкую дату выбрать нельзя: система использует ближайшее подходящее окно по местному времени.</div><label>Максимум размещений в сутки</label><input id="platDaily" inputmode="numeric" min="1" value="${fmt(p&&p.daily_limit||1)}"><label>Минимальный интервал, часов</label><input id="platInterval" inputmode="numeric" min="1" value="${fmt(p&&p.min_interval_hours||6)}"><div class="form-grid"><div><label>С</label><input id="platStart" type="time" value="${esc(p&&p.window_start||'09:00')}"></div><div><label>До</label><input id="platEnd" type="time" value="${esc(p&&p.window_end||'22:00')}"></div></div><button class="btn gold full" id="platSave">Сохранить</button>`);document.getElementById('platSave').onclick=async()=>{try{const r=await api('network.platform_update',{chat_id:chatId,daily_limit:Math.max(1,Number(document.getElementById('platDaily').value)),min_interval_hours:Math.max(1,Number(document.getElementById('platInterval').value)),window_start:document.getElementById('platStart').value,window_end:document.getElementById('platEnd').value,timezone_offset_minutes:tz,topic_code:p&&p.topic_code||'general',language_code:p&&p.language_code||'ru'});toast(resultText(r.result));closeModal(true);showNetwork();}catch(e){toast(e.message,true);}};}

  async function renderTasks(){setLoading('Проверяем выполнения…');const data=await api('tasks.get');cache.tasks=data;if(data.auto_check&&Number(data.auto_check.verified||0)>0)toast(`Подтверждено заданий: ${fmt(data.auto_check.verified)}`);const available=(data.available||[]).map(t=>`<article class="row"><div class="row-head"><div><h3>${esc(t.title||`Задание #${t.id}`)}</h3><span class="badge green">${fmt(t.reward_amount)} Искр</span></div><span class="badge">осталось ${fmt((t.total_quantity||0)-(t.completed_quantity||0))}</span></div><p class="muted small">${esc(taskTypeName(t.task_type))} · ${Number(t.auto_verify_enabled)?'автоматическая проверка':'проверка по подтверждению'}</p><div class="actions"><button class="btn tiny" data-take="${t.id}">Взять задание</button></div></article>`).join('')||'<div class="empty">Новых заданий пока нет.</div>';const subs=(data.submissions||[]).map(s=>{const state=verificationName(s.verification_state,s.status);const holding=s.status==='approved'&&s.verification_state==='holding';return `<article class="row"><div class="row-head"><div><h3>${esc(s.campaign_title||`Задание #${s.campaign_id}`)}</h3><span class="badge ${s.status==='approved'?'green':s.status==='rejected'||s.status==='revoked'?'red':'gold'}">${esc(statusName(s.status))}</span></div><b>${fmt(s.reward_amount)} Искр</b></div><p class="muted small">${esc(taskTypeName(s.campaign_task_type))} · ${esc(state)}</p>${holding?`<p class="muted small">Искры начислены на проверку и станут доступны после контрольного периода.</p>`:''}${s.reject_reason?`<p class="muted small">Причина: ${esc(resultText(s.reject_reason))}</p>`:''}<div class="actions">${s.status==='taken'?`<button class="btn gold tiny" data-do="${s.id}">Выполнить</button><button class="btn secondary tiny" data-check="${s.id}">Проверить сейчас</button>${Number(s.auto_verify_enabled)?'':`<button class="btn secondary tiny" data-proof="${s.id}">Отправить подтверждение</button>`}`:`<button class="btn secondary tiny" data-open-link="${esc(s.target_url)}">Открыть цель</button>`}</div></article>`;}).join('')||'<div class="empty">Активных заданий нет.</div>';app.innerHTML=`<section class="page"><div class="notice">Нажми «Выполнить», соверши действие в Telegram и вернись. Boostora проверит результат сама; отдельная кнопка оставлена как резервная.</div><div class="section-head"><h2>Задания</h2><span>${data.active_count}/${data.active_limit} активно</span></div><div class="section-head"><h2>Доступные</h2></div><div class="list">${available}</div><div class="section-head"><h2>Мои выполнения</h2></div><div class="list">${subs}</div></section>`;bindExternalLinks();app.querySelectorAll('[data-take]').forEach(b=>b.onclick=async()=>{try{const d=await api('tasks.take',{campaign_id:Number(b.dataset.take)});toast(resultText(d.result));renderTasks();}catch(e){toast(e.message,true);}});app.querySelectorAll('[data-do]').forEach(b=>b.onclick=async()=>{try{const d=await api('tasks.open',{submission_id:Number(b.dataset.do)});if(d.result)toast(resultText(d.result));openExternal(d.target_url);}catch(e){toast(e.message,true);}});app.querySelectorAll('[data-check]').forEach(b=>b.onclick=async()=>{try{const d=await api('tasks.check',{submission_id:Number(b.dataset.check)});toast(resultText(d.result));renderTasks();}catch(e){toast(e.message,true);}});app.querySelectorAll('[data-proof]').forEach(b=>b.onclick=()=>openProofModal(Number(b.dataset.proof)));}
  function openProofModal(id){openModal('Подтверждение выполнения',`<label>Опиши выполненное действие и приложи ссылку, если она нужна</label><textarea id="proofText" placeholder="Выполнил задание…"></textarea><button class="btn full" id="proofSend">Отправить на проверку</button>`);document.getElementById('proofSend').onclick=async()=>{try{const d=await api('tasks.submit',{submission_id:id,proof:document.getElementById('proofText').value});toast(resultText(d.result));closeModal();renderTasks();}catch(e){toast(e.message,true);}};}

  async function renderWallet(){setLoading('Загружаем кошелёк…');const data=await api('wallet.get');cache.wallet=data;const w=data.summary||{};const packs=(data.packs||[]).map(p=>`<button class="chip" data-pack="${esc(p.code)}">${fmt(p.sparks)} Искр · ${fmt(p.stars)} ⭐</button>`).join('');const tx=(data.transactions||[]).map(t=>`<article class="row"><div class="row-head"><div><h4>${esc(t.entry_type.replaceAll('_',' '))}</h4><span class="muted small">${esc(t.created_at)}</span></div><b style="color:${t.direction==='credit'?'#a6ffd7':'#ffc0c0'}">${t.direction==='credit'?'+':'−'}${fmt(t.amount)} ${t.currency_code==='BST'?'Искр':esc(t.currency_code)}</b></div></article>`).join('')||'<div class="empty">Операций пока нет.</div>';app.innerHTML=`<section class="page"><div class="hero"><div><p class="eyebrow">Кошелёк Boostora</p><h1>${fmt(w.campaign_balance)} Искр</h1><p>Доступно для кампаний. Пополнение Telegram Stars открывается прямо в Mini App.</p></div><img src="assets/wallet-hold.webp" alt=""></div><div class="section-head"><h2>Баланс</h2></div><div class="stat-grid"><div class="stat"><b>${fmt(w.internal_balance)}</b><span>основные Искры</span></div><div class="stat"><b>${fmt(w.bonus_balance)}</b><span>бонусные</span></div><div class="stat"><b>${fmt(w.hold_balance)}</b><span>на удержании</span></div><div class="stat"><b>${fmt(w.lifetime_earned)}</b><span>заработано</span></div></div><div class="section-head"><h2>Пополнить</h2><button class="btn tiny secondary" id="customTopup">Своя сумма</button></div><div class="chips">${packs}</div><div class="section-head"><h2>История</h2></div><div class="list">${tx}</div></section>`;app.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>createWalletInvoice({kind:'pack',code:b.dataset.pack}));document.getElementById('customTopup').onclick=()=>openCustomTopup();}
  async function createWalletInvoice(payload){try{const d=await api('wallet.invoice',payload);await openInvoice(d.invoice_url,async status=>{if(status==='paid'){toast('Баланс пополнен.');setTimeout(async()=>{await refreshSession();renderWallet();},900);}});}catch(e){toast(e.message,true);}}

  async function renderProfile(){setLoading('Загружаем профиль…');const data=await api('profile.get');cache.profile=data;const u=data.user||{},eng=data.engagement||{},ob=data.obligations||{},ref=data.referrals||{};const done=Number(ob.total_done||0),required=Math.max(1,Number(eng.required_actions||10));const pct=Math.min(100,Math.round(done*100/required));app.innerHTML=`<section class="page"><div class="profile"><img class="avatar" src="assets/telegram-profile.webp" alt=""><div><b>${esc([u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||'Пользователь')}</b><div class="muted">${u.username?'@'+esc(u.username):''} · ${esc(roleName(u.role))}</div></div></div><div class="section-head"><h2>Роль</h2><span>меняется сразу</span></div><div class="grid two"><button class="btn ${u.role==='client'?'gold':'secondary'}" data-role="client">Заказчик</button><button class="btn ${u.role==='performer'?'gold':'secondary'}" data-role="performer">Исполнитель</button></div><div class="section-head"><h2>Standard и PRO</h2><span>${esc(eng.mode==='pro'?'PRO':eng.mode==='standard'?'Standard':'не выбран')}</span></div><div class="grid two"><article class="card"><img src="assets/standard.webp" alt=""><h3>Standard</h3><p class="muted">Взаимная активность с ответными действиями.</p><button class="btn secondary full" id="setStandard">Выбрать Standard</button></article><article class="card"><img src="assets/pro.webp" alt=""><h3>PRO</h3><p class="muted">Без ответных обязательств на 30 дней.</p><button class="btn gold full" id="buyPro">Купить за ${fmt(eng.pro_price_credits||1990)} Искр</button></article></div><div class="section-head"><h2>Обязательства</h2><span>осталось ${fmt(ob.total_remaining)}</span></div><div class="profile"><img class="avatar" src="assets/obligations.webp" alt=""><div><b>Ответные действия Standard</b><div class="muted small">Следи за сроками и прогрессом прямо здесь.</div></div></div><div class="row" style="margin-top:9px"><div class="row-head"><b>Прогресс</b><spa     app.querySelectorAll('[data-role]').forEach(b=>b.onclick=async()=>{try{await api('profile.update',{role:b.dataset.role});await refreshSession();toast('Роль обновлена.');renderProfile();}catch(e){toast(e.message,true);}});document.getElementById('setStandard').onclick=async()=>{try{await api('engagement.standard');await refreshSession();toast('Режим Standard включён.');renderProfile();}catch(e){toast(e.message,true);}};document.getElementById('buyPro').onclick=async()=>{if(!confirm('Списать Искры и активировать PRO на 30 дней?'))return;try{const d=await api('engagement.pro_purchase');toast(resultText(d.result));await refreshSession();renderProfile();}catch(e){toast(e.message,true);}};document.getElementById('copyReferral').onclick=()=>copyText(ref.link);document.getElementById('changeLanguage').onclick=()=>showLanguageModal(data.languages||[]);document.getElementById('documentsBtn').onclick=showDocumentsGate;if(document.getElementById('managementBtn'))document.getElementById('managementBtn').onclick=()=>setPage('management'); }

  async function showDocumentsGate(){try{const d=await api('documents.get');const rules=d.rules||{},legal=d.legal||{};const accepted=!!d.accepted;openModal('Правила и условия',`<div class="profile"><img class="avatar" src="assets/community-rules.webp" alt=""><div><b>Соглашение Boostora</b><div class="muted small">Без принятия условий функции бота и Mini App недоступны.</div></div></div><h3>Правила сообщества</h3>${(rules.sections||[]).map(s=>`<details class="row"><summary><b>${esc(s.title)}</b></summary><p class="muted">${esc(s.body)}</p></details>`).join('')}<h3>Условия использования</h3>${(legal.sections||[]).map(s=>`<details class="row"><summary><b>${esc(s.title)}</b></summary><p class="muted">${esc(s.body)}</p></details>`).join('')}${accepted?'<div class="notice">Условия приняты.</div>':'<div class="notice">Нажимая «Согласен и продолжить», ты принимаешь действующую редакцию целиком.</div><button class="btn gold full" id="acceptAllDocs">Согласен и продолжить</button><button class="btn danger full" id="declineDocs" style="margin-top:8px">Не согласен</button>'}`,!accepted);if(document.getElementById('acceptAllDocs'))document.getElementById('acceptAllDocs').onclick=async()=>{try{await api('documents.accept',{});await refreshSession();nav.hidden=false;closeModal(true);toast('Условия приняты.');renderCurrent();if(!session.access.role)setTimeout(()=>showRoleGate(),100);}catch(e){toast(e.message,true);}};if(document.getElementById('declineDocs'))document.getElementById('declineDocs').onclick=async()=>{try{await api('documents.decline',{});}catch(_){}modalBody.innerHTML='<div class="notice">Без принятия условий Boostora недоступна. При следующем запуске соглашение будет предложено снова.</div>';try{setTimeout(()=>tg&&tg.close(),800);}catch(_){}};}catch(e){toast(e.message,true);}}
  function showSubscriptionGate(chats){openModal('Нужно вступить в сообщество',`<p class="muted">Для работы в Boostora вступи в обязательное сообщество, затем нажми проверку.</p><div class="list">${chats.map(c=>`<button class="btn secondary full" data-join="${esc(c.url)}">Открыть ${esc(c.name)}</button>`).join('')}</div><button class="btn gold full" id="checkSub" style="margin-top:10px">Проверить подписку</button>`);modalBody.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>openExternal(b.dataset.join));document.getElementById('checkSub').onclick=async()=>{try{const d=await api('subscription.check');if(d.subscribed){closeModal();toast('Подписка подтверждена.');renderCurrent();}else toast('Подписка пока не найдена.',true);}catch(e){toast(e.message,true);}};}

  async function renderManagement(){if(!session.access.is_admin){setPage('profile');return;}setLoading('Загружаем управление…');const admin=await api('admin.get');cache.admin=admin;let owner=null;if(session.access.is_owner){owner=await api('owner.get');cache.owner=owner;}const queue=(admin.queue||[]).map(q=>`<article class="row"><div class="row-head"><div><h4>Заявка #${q.id}</h4><span class="badge ${Number(q.risk_score||0)>40?'red':'gold'}">риск ${fmt(q.risk_score)}</span></div><b>${fmt(q.reward_amount)} Искр</b></div><p class="muted small">${esc(q.campaign_title||q.task_type||'')}</p><p class="small">${esc(q.proof_text||'Без текста')}</p><div class="actions"><button class="btn tiny" data-review="approve" data-sid="${q.id}">Одобрить</button><button class="btn danger tiny" data-review="reject" data-sid="${q.id}">Отклонить</button></div></article>`).join('')||'<div class="empty">Очередь пуста.</div>';const ownerHtml=owner?`<div class="section-head"><h2>Владелец</h2><span>закрытый раздел</span></div><div class="stat-grid"><div class="stat"><b>${fmt(owner.commerce?.total_users)}</b><span>пользователей</span></div><div class="stat"><b>${fmt(owner.commerce?.active_campaigns)}</b><span>активных кампаний</span></div><div class="stat"><b>${fmt(owner.provider?.order_summary?.total)}</b><span>заказов услуг</span></div><div class="stat"><b>${fmt(owner.release?.audit?.score)}</b><span>аудит</span></div></div><div class="grid two" style="margin-top:11px"><article class="card"><img src="assets/server-status.webp" alt=""><h3>Поставщик</h3><button class="btn secondary full" id="providerManage">🧩 Каталог услуг</button></article><article class="card"><img src="assets/release-center.webp" alt=""><h3>Контроль заказов</h3><button class="btn secondary full" id="pendingOrders">📦 Заказы услуг</button></article><article class="card"><img src="assets/wallet-hold.webp" alt=""><h3>Баланс пользователя</h3><button class="btn secondary full" id="ownerUserOps">🔎 Найти и проверить</button></article><article class="card"><img src="assets/obligations.webp" alt=""><h3>Экономика и сеть</h3><button class="btn secondary full" id="ownerRuntimeSettings">⚙️ Настройки</button></article><article class="card"><img src="assets/release-center.webp" alt=""><h3>Последние операции</h3><button class="btn secondary full" id="ownerRecentOps">📋 Открыть по запросу</button></article></div>`:'';app.innerHTML=`<section class="page"><div class="section-head"><h2>Управление</h2><button class="btn secondary tiny" data-go="profile">← Профиль</button></div><div class="stat-grid"><div class="stat"><b>${fmt(admin.stats?.queue_count)}</b><span>на проверке</span></div><div class="stat"><b>${fmt(admin.stats?.blocked_users)}</b><span>заблокировано</span></div><div class="stat"><b>${fmt(admin.stats?.high_risk_users)}</b><span>высокий риск</span></div><div class="stat"><b>${fmt(admin.stats?.rejected_total)}</b><span>отклонено</span></div></div>${ownerHtml}<div class="section-head"><h2>Ручная проверка</h2></div><div class="list">${queue}</div></section>`;app.querySelector('[data-go]').onclick=()=>setPage('profile');app.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>reviewSubmission(Number(b.dataset.sid),b.dataset.review==='approve'));if(document.getElementById('providerManage'))document.getElementById('providerManage').onclick=showOwnerCatalog;if(document.getElementById('pendingOrders'))document.getElementById('pendingOrders').onclick=showOwnerOrders;if(document.getElementById('ownerUserOps'))document.getElementById('ownerUserOps').onclick=showOwnerUserLookup;if(document.getElementById('ownerRuntimeSettings'))document.getElementById('ownerRuntimeSettings').onclick=showOwnerRuntimeSettings;if(document.getElementById('ownerRecentOps'))document.getElementById('ownerRecentOps').onclick=showOwnerRecentOperations;}
  async function reviewSubmission(id,approve){let reason='';if(!approve)reason=prompt('Причина отклонения:')||'Не подтверждено';try{const d=await api('admin.review',{submission_id:id,approve,reason});toast(resultText(d.result));renderManagement();}catch(e){toast(e.message,true);}}
  function showOwnerUserLookup(){openModal('Проверка пользователя',`<label>Telegram ID или @username</label><input id="ownerUserQuery" placeholder="2097006037 или @username"><button class="btn gold full" id="ownerUserFind">Найти</button><div id="ownerUserResult"></div>`);document.getElementById('ownerUserFind').onclick=async()=>{try{const d=await api('owner.user_lookup',{query:document.getElementById('ownerUserQuery').value});renderOwnerUserCard(d);}catch(e){toast(e.message,true);}};}
  function renderOwnerUserCard(d){const u=d.user||{};document.getElementById('ownerUserResult').innerHTML=`<div class="row" style="margin-top:12px"><h3>${esc(u.username?'@'+u.username:(u.first_name||'Пользователь'))}</h3><p class="muted small">ID ${fmt(u.user_id)} · статус ${esc(u.status||'active')}</p><div class="stat-grid"><div class="stat"><b>${fmt(u.internal_balance)}</b><span>Искр</span></div><div class="stat"><b>${fmt(u.bonus_balance)}</b><span>бонусов</span></div><div class="stat"><b>${fmt(u.hold_balance)}</b><span>удержано</span></div><div class="stat"><b>${fmt((d.platforms||[]).length)}</b><span>площадок</span></div></div><div class="actions"><button class="btn secondary tiny" id="ownerTxBtn">Операции</button><button class="btn secondary tiny" id="ownerAdjustBtn">Изменить баланс</button><button class="btn secondary tiny" id="ownerPaymentsBtn">Покупки Stars</button></div></div>`;document.getElementById('ownerTxBtn').onclick=()=>showOwnerTransactions(Number(u.user_id));document.getElementById('ownerAdjustBtn').onclick=()=>showOwnerAdjust(Number(u.user_id));document.getElementById('ownerPaymentsBtn').onclick=()=>showOwnerStarPayments(Number(u.user_id));}
  function showOwnerTransactions(userId){openModal('История операций',`<div class="chips">${[1,5,10,20,50,100,150].map(n=>`<button class="chip" data-op-limit="${n}">${n}</button>`).join('')}</div><div id="ownerTxRows"><div class="empty">Выбери количество последних операций.</div></div>`);modalBody.querySelectorAll('[data-op-limit]').forEach(b=>b.onclick=async()=>{try{const d=await api('owner.operations',{user_id:userId,limit:Number(b.dataset.opLimit)});document.getElementById('ownerTxRows').innerHTML=(d.operations||[]).map(t=>`<article class="row"><div class="row-head"><div><b>#${fmt(t.id)} · ${esc(t.entry_type||'операция')}</b><div class="muted small">${esc(t.created_at||'')}</div></div><b>${t.direction==='credit'?'+':'−'}${fmt(t.amount)} ${(t.currency_code||'BST')==='BST'?'Искр':esc(t.currency_code||'BST')}</b></div><p class="muted small">${esc(t.note||'')}</p></article>`).join('')||'<div class="empty">Операций нет.</div>';}catch(e){toast(e.message,true);}});}
  async function showOwnerStarPayments(userId){openModal('Покупки за Stars','<section class="empty"><span class="loader"></span></section>');try{const d=await api('owner.star_payments',{user_id:userId,limit:100});modalBody.innerHTML=(d.payments||[]).map(p=>`<article class="row"><div class="row-head"><div><h4>Платёж #${fmt(p.id)}</h4><span class="badge ${p.status==='paid'?'green':p.status==='refunded'?'gold':'red'}">${esc(p.status)}</span></div><b>${fmt(p.stars_amount)} ⭐</b></div><p class="muted small">Начислено ${fmt(p.credits_granted)} Искр · ${esc(p.created_at||'')}</p>${p.status==='paid'?`<button class="btn danger tiny full" data-refund-payment="${p.id}">Рассмотреть возврат</button>`:''}</article>`).join('')||'<div class="empty">Покупок нет.</div>';modalBody.querySelectorAll('[data-refund-payment]').forEach(b=>b.onclick=()=>showOwnerRefund(Number(b.dataset.refundPayment),userId));}catch(e){modalBody.innerHTML=`<div class="notice error">${esc(e.message)}</div>`;}}
  function showOwnerRefund(paymentId,userId){openModal('Исключительный возврат',`<div class="notice">Возврат выполняется полностью по выбранному платежу. Перед запросом Telegram система снимет начисленные по нему Искры. Автоматических возвратов пользователям нет.</div><label>Дополнительно списать бонусов</label><input id="refundBonus" inputmode="numeric" value="0"><label>Причина решения</label><textarea id="refundReason" placeholder="Причина обязательна"></textarea><button class="btn danger full" id="refundConfirm">Подтвердить полный возврат</button>`);document.getElementById('refundConfirm').onclick=async()=>{if(!confirm('Подтвердить полный возврат Stars по этому платежу?'))return;try{const r=await api('owner.refund_star_payment',{payment_id:paymentId,bonus_to_remove:Number(document.getElementById('refundBonus').value||0),reason:document.getElementById('refundReason').value});toast(resultText(r.result));showOwnerStarPayments(userId);}catch(e){toast(e.message,true);}};}
  function showOwnerAdjust(userId){openModal('Изменение баланса',`<label>Баланс</label><select id="ownerBalanceType"><option value="credits">Искры</option><option value="bonus">Бонусы</option></select><label>Сумма</label><input id="ownerDelta" inputmode="numeric" placeholder="100 или -100"><label>Причина</label><textarea id="ownerReason" placeholder="Причина обязательна"></textarea><div class="notice">Отрицательное число списывает баланс. Каждое действие записывается отдельной операцией.</div><button class="btn gold full" id="ownerAdjustSave">Подтвердить</button>`);document.getElementById('ownerAdjustSave').onclick=async()=>{try{const d=await api('owner.adjust_balance',{user_id:userId,balance_type:document.getElementById('ownerBalanceType').value,amount:Number(document.getElementById('ownerDelta').value),reason:document.getElementById('ownerReason').value});toast(resultText(d.result));closeModal(true);showOwnerUserLookup();}catch(e){toast(e.message,true);}};}

  function showOwnerRecentOperations(){openModal('Последние операции',`<div class="chips">${[1,5,10,20,50,100,150].map(n=>`<button class="chip" data-global-op-limit="${n}">${n}</button>`).join('')}</div><div id="ownerGlobalRows"><div class="empty">Выбери количество операций.</div></div>`);modalBody.querySelectorAll('[data-global-op-limit]').forEach(b=>b.onclick=async()=>{try{const d=await api('owner.recent_operations',{limit:Number(b.dataset.globalOpLimit)});document.getElementById('ownerGlobalRows').innerHTML=(d.operations||[]).map(t=>`<article class="row"><div class="row-head"><div><b>${esc(t.username?'@'+t.username:(t.first_name||'ID '+t.user_id))}</b><div class="muted small">#${fmt(t.id)} · ${esc(t.entry_type||'операция')} · ${esc(t.created_at||'')}</div></div><b>${t.direction==='credit'?'+':'−'}${fmt(t.amount)} ${(t.currency_code||'BST')==='BST'?'Искр':esc(t.currency_code||'BST')}</b></div><p class="muted small">${esc(t.note||'')}</p></article>`).join('')||'<div class="empty">Операций нет.</div>';}catch(e){toast(e.message,true);}});}
  async function showOwnerRuntimeSettings(){openModal('Экономика и сеть','<section class="empty"><span class="loader"></span></section>');try{const d=await api('owner.runtime_settings');const groups={economy:'Искры и бонусы',network:'Сеть размещений',provider:'Дополнительные услуги'};modalBody.innerHTML=Object.entries(groups).map(([code,label])=>`<div class="section-head"><h2>${label}</h2></div><div class="list">${(d.settings||[]).filter(x=>x.group===code).map(x=>`<article class="row"><label>${esc(x.label)}</label><div class="form-grid"><input data-setting-value="${esc(x.key)}" inputmode="numeric" value="${fmt(x.value)}"><button class="btn secondary tiny" data-setting-save="${esc(x.key)}">Сохранить</button></div><p class="muted small">Допустимо: ${fmt(x.minimum)}–${fmt(x.maximum)} · стандарт ${fmt(x.default)}</p></article>`).join('')}</div>`).join('');modalBody.querySelectorAll('[data-setting-save]').forEach(b=>b.onclick=async()=>{const key=b.dataset.settingSave;const input=modalBody.querySelector(`[data-setting-value="${key}"]`);try{const r=await api('owner.runtime_setting_update',{key,value:Number(input.value)});toast(resultText(r.result));}catch(e){toast(e.message,true);}});}catch(e){modalBody.innerHTML=`<div class="notice error">${esc(e.message)}</div>`;}}
  async function showOwnerCatalog(){openModal('Дополнительные услуги','<section class="empty"><span class="loader"></span></section>');await loadOwnerCatalog();}
  async function loadOwnerCatalog(){try{const d=await api('owner.catalog',ownerCatalogState);cache.ownerCatalog=d;const cats=[{code:'',label:'Все'},...(d.categories||[])],subs=[{code:'',label:'Все'},...(d.subcategories||[])];modalBody.innerHTML=`<div class="actions"><button class="btn tiny gold" id="syncCatalog">Синхронизировать</button>${ownerCatalogState.category?`<button class="btn tiny secondary" id="enableFolder">Добавить раздел</button><button class="btn tiny danger" id="disableFolder">Убрать раздел</button>`:''}</div><div class="chips">${cats.map(c=>`<button class="chip ${ownerCatalogState.category===c.code?'active':''}" data-ocat="${esc(c.code)}">${esc(c.label)}</button>`).join('')}</div>${ownerCatalogState.category?`<div class="chips">${subs.map(s=>`<button class="chip ${ownerCatalogState.subcategory===s.code?'active':''}" data-osub="${esc(s.code)}">${esc(s.label)}</button>`).join('')}</div>`:''}<div class="list">${(d.services||[]).map(s=>`<article class="row"><div class="row-head"><div><h4>${esc(s.name)}</h4><span class="badge">${esc(s.subcategory_label)}</span><p class="muted small">Тариф: ${esc(s.rate??'—')} · наценка ${fmt(s.markup_percent)}%</p></div><span class="badge ${s.enabled?'green':'red'}">${s.enabled?'В витрине':'Скрыта'}</span></div><div class="actions"><button class="btn ${s.enabled?'danger':'secondary'} tiny" data-toggle-service="${esc(s.id)}">${s.enabled?'Убрать':'Добавить'}</button><button class="btn secondary tiny" data-markup-service="${esc(s.id)}" data-current-markup="${fmt(s.markup_percent)}">Наценка</button></div></article>`).join('')||'<div class="empty">Нет услуг.</div>'}<div class="actions"><button class="btn secondary tiny" id="ownerPrev" ${d.page<=1?'disabled':''}>←</button><span class="pill">${d.page}/${d.pages}</span><button class="btn secondary tiny" id="ownerNext" ${d.page>=d.pages?'disabled':''}>→</button></div>`;modalBody.querySelectorAll('[data-ocat]').forEach(b=>b.onclick=()=>{ownerCatalogState.category=b.dataset.ocat;ownerCatalogState.subcategory='';ownerCatalogState.page=1;loadOwnerCatalog();});modalBody.querySelectorAll('[data-osub]').forEach(b=>b.onclick=()=>{ownerCatalogState.subcategory=b.dataset.osub;ownerCatalogState.page=1;loadOwnerCatalog();});modalBody.querySelectorAll('[data-toggle-service]').forEach(b=>b.onclick=()=>ownerCatalogAction('toggle',{service_id:b.dataset.toggleService}));modalBody.querySelectorAll('[data-markup-service]').forEach(b=>b.onclick=()=>{const value=prompt('Наценка для этой услуги, %',b.dataset.currentMarkup||'35');if(value!==null)ownerCatalogAction('set_markup',{service_id:b.dataset.markupService,markup_percent:Number(value)});});document.getElementById('syncCatalog').onclick=()=>ownerCatalogAction('sync');if(document.getElementById('enableFolder'))document.getElementById('enableFolder').onclick=()=>ownerCatalogAction('folder_enable',{category:ownerCatalogState.category,subcategory:ownerCatalogState.subcategory});if(document.getElementById('disableFolder'))document.getElementById('disableFolder').onclick=()=>ownerCatalogAction('folder_disable',{category:ownerCatalogState.category,subcategory:ownerCatalogState.subcategory});document.getElementById('ownerPrev').onclick=()=>{ownerCatalogState.page--;loadOwnerCatalog();};document.getElementById('ownerNext').onclick=()=>{ownerCatalogState.page++;loadOwnerCatalog();};}catch(e){modalBody.innerHTML=`<div class="notice error">${esc(e.message)}</div>`;}}
  async function ownerCatalogAction(action,extra={}){try{const d=await api('owner.catalog_action',{action,...extra});toast(resultText(d.result));loadOwnerCatalog();}catch(e){toast(e.message,true);}}
  async function showOwnerOrders(){openModal('Заказы дополнительных услуг','<section class="empty"><span class="loader"></span></section>');try{const rows=await api('owner.orders',{limit:150});modalBody.innerHTML=(rows.orders||[]).map(o=>`<article class="row"><div class="row-head"><div><h4>#${o.id} · ${esc(o.service_name||'Услуга')}</h4><p class="muted small">${esc(o.username?'@'+o.username:(o.first_name||'Пользователь'))} · ID ${fmt(o.owner_user_id)}</p><span class="badge">${esc(statusName(o.provider_status))}</span></div><b>${fmt(o.credit_cost||o.charge_value)} Искр</b></div>${['paid_pending','failed'].includes(o.provider_status)?`<button class="btn tiny full" data-place-order="${o.id}">Запустить заказ</button>`:''}</article>`).join('')||'<div class="empty">Заказов нет.</div>';modalBody.querySelectorAll('[data-place-order]').forEach(b=>b.onclick=async()=>{try{const d=await api('owner.place_order',{order_id:Number(b.dataset.placeOrder)});toast(resultText(d.result));showOwnerOrders();}catch(e){toast(e.message,true);}});}catch(e){modalBody.innerHTML=`<div class="notice error">${esc(e.message)}</div>`;}}

  async function openInvoice(url,callback){return new Promise(resolve=>{if(!tg||typeof tg.openInvoice!=='function'){openExternal(url);resolve('opened');return;}tg.openInvoice(url,status=>{callback&&callback(status);resolve(status);});});}
  function openExternal(url){if(!url)return;try{if(tg&&/^https:\/\/(t\.me|telegram\.me)\//i.test(url)&&tg.openTelegramLink)tg.openTelegramLink(url);else if(tg&&tg.openLink)tg.openLink(url);else location.href=url;}catch(_){location.href=url;}}
  function bindExternalLinks(){app.querySelectorAll('[data-open-link]').forEach(b=>b.onclick=()=>openExternal(b.dataset.openLink));}
  async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Ссылка скопирована.');}catch(_){openExternal(text);}}
  let resumeCheckBusy=false,lastResumeCheck=0;
  async function checkTasksAfterReturn(){if(resumeCheckBusy||!session.access||session.access.role!=='performer')return;const now=Date.now();if(now-lastResumeCheck<1500)return;lastResumeCheck=now;resumeCheckBusy=true;try{const d=await api('tasks.autocheck');if(Number(d.verified||0)>0)toast(`Выполнено — Искры начислены: ${fmt(d.verified)}`);if(currentPage==='work'&&Number(d.checked||0)>0)await renderTasks();}catch(_){/* резервная кнопка остаётся доступной */}finally{resumeCheckBusy=false;}}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkTasksAfterReturn();});
  window.addEventListener('focus',checkTasksAfterReturn);

  loadSession().catch(e=>{app.innerHTML=`<section class="notice error">${esc(e.message||'Не удалось открыть кабинет.')}</section>`;toast(e.message,true);});
})();
</script>
</body>
</html>
